name: gn-storefront

x-app-env: &app-env
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379
    MEILI_HOST: http://meilisearch:7700

services:
  app:
    build: { context: ., target: dev }
    <<: *app-env
    ports: ["${APP_PORT:-3030}:3000"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }

  worker:
    build: { context: ., target: dev }
    <<: *app-env
    command: ["npm", "run", "sync:catalog"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    depends_on:
      meilisearch: { condition: service_healthy }

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11.3
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me-0123456789}
    volumes: [meili_data:/meili_data]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      retries: 20

  app-prod:
    profiles: [prod]
    build: { context: ., target: runner }
    <<: *app-env
    ports: ["${APP_PROD_PORT:-3031}:3000"]
    depends_on:
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }

  test-unit:
    profiles: [test]
    build: { context: ., target: dev }
    environment: { COMMERCE_ADAPTER: fixture }
    command: ["npx", "vitest", "run"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

  test-e2e:
    profiles: [test]
    image: mcr.microsoft.com/playwright:v1.48.2-noble
    working_dir: /app
    ipc: host
    environment:
      E2E_BASE_URL: http://app:3000
    command: ["npx", "playwright", "test"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    depends_on: [app]

volumes:
  node_modules:
  next_cache:
  redis_data:
  meili_data:
